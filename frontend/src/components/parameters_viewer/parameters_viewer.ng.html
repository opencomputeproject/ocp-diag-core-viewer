<mat-expansion-panel
  id="parameters-section"
  class="parameters-panel"
  [disabled]="!hasParameters"
  [hideToggle]="!hasParameters"
  (opened)="expanded = true"
  (closed)="expanded = false">
  <mat-expansion-panel-header class="parameters-panel-header">
    <mat-panel-title>{{ title }}</mat-panel-title>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <div *ngIf="hasParameters" class="parameters-viewer">
      <ngx-json-viewer id="parameters-json" [depth]="depth" [json]="parameters"></ngx-json-viewer>
    </div>
  </ng-template>
</mat-expansion-panel>

<ng-container *ngIf="hasParameters; else noParameters">
  <div *ngIf="!expanded" id="parameters-collapsed-hint" class="parameters-collapsed-hint">
    Click above gray area to view params
  </div>
</ng-container>

<ng-template #noParameters>
  <div id="parameters-empty" class="parameters-empty">No data available</div>
</ng-template>
